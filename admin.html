<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Projects</title>
  <link href="./src/output.css" rel="stylesheet">
</head>
<body class="bg-[#FAFAFA] text-[#18181B] font-sans p-6 md:p-12 selection:bg-[#18181B] selection:text-white">

  <!-- Container Login -->
  <div id="login-section" class="max-w-md mx-auto bg-white p-8 border-2 border-[#18181B] shadow-[8px_8px_0px_0px_#18181B] rounded-xl mt-20">
    <h2 class="text-3xl font-black uppercase tracking-tight mb-6">Admin Login</h2>
    <input type="email" id="email" placeholder="Email" class="w-full mb-4 p-3 border-2 border-[#18181B] rounded focus:outline-none focus:ring-2 focus:ring-neutral-400">
    <input type="password" id="password" placeholder="Password" class="w-full mb-6 p-3 border-2 border-[#18181B] rounded focus:outline-none focus:ring-2 focus:ring-neutral-400">
    <button onclick="login()" class="w-full bg-[#18181B] text-white font-bold uppercase tracking-wider py-3 border-2 border-[#18181B] rounded hover:bg-neutral-800 transition-colors">Login</button>
  </div>

  <!-- Container Dashboard Admin (Awalnya disembunyikan) -->
  <div id="dashboard-section" class="max-w-5xl mx-auto hidden">
    <div class="flex justify-between items-center mb-8 border-b-2 border-[#18181B] pb-4">
      <div>
        <h1 class="text-4xl font-black uppercase tracking-tighter">Projects Dashboard</h1>
        <p class="text-neutral-600 font-medium mt-1">Manage your portfolio projects here.</p>
      </div>
      <button onclick="logout()" class="bg-red-500 text-white px-5 py-2 font-bold uppercase tracking-wider border-2 border-[#18181B] rounded hover:bg-red-600 shadow-[4px_4px_0px_0px_#18181B] hover:translate-y-[2px] hover:shadow-[2px_2px_0px_0px_#18181B] transition-all">Logout</button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Form Tambah Project -->
      <div class="lg:col-span-1 bg-white p-6 border-2 border-[#18181B] shadow-[6px_6px_0px_0px_#18181B] rounded-xl h-fit">
        <h3 class="text-xl font-black uppercase tracking-tight mb-4">Add New Project</h3>
        <form id="project-form" class="space-y-4">
          <div>
            <label class="text-xs font-bold uppercase tracking-wider">Project Title</label>
            <input type="text" id="title" required class="w-full p-2.5 mt-1 border-2 border-[#18181B] rounded" placeholder="X TJKT 1 Web Profile">
          </div>
          <div>
            <label class="text-xs font-bold uppercase tracking-wider">Subtitle / Type</label>
            <input type="text" id="subtitle" required class="w-full p-2.5 mt-1 border-2 border-[#18181B] rounded" placeholder="Web Profile">
          </div>
          <div>
            <label class="text-xs font-bold uppercase tracking-wider">Filter Category</label>
            <input type="text" id="category" required class="w-full p-2.5 mt-1 border-2 border-[#18181B] rounded" placeholder="web">
            <p class="text-[10px] text-neutral-500 mt-1">Harus sama dengan data-filter (contoh: "web")</p>
          </div>
          <div>
            <label class="text-xs font-bold uppercase tracking-wider">Description</label>
            <textarea id="description" required rows="3" class="w-full p-2.5 mt-1 border-2 border-[#18181B] rounded" placeholder="A web profile that showing..."></textarea>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="text-xs font-bold uppercase tracking-wider">Year</label>
              <input type="text" id="year" required class="w-full p-2.5 mt-1 border-2 border-[#18181B] rounded" placeholder="2026">
            </div>
            <div>
              <label class="text-xs font-bold uppercase tracking-wider">Tech Stack</label>
              <input type="text" id="techStack" required class="w-full p-2.5 mt-1 border-2 border-[#18181B] rounded" placeholder="HTML5, CSS, JS">
            </div>
          </div>
          <div>
            <label class="text-xs font-bold uppercase tracking-wider">Image URL</label>
            <input type="text" id="imageUrl" required class="w-full p-2.5 mt-1 border-2 border-[#18181B] rounded" placeholder="Images/X TJKT 1.png">
          </div>
          <div>
            <label class="text-xs font-bold uppercase tracking-wider">Visit URL</label>
            <input type="url" id="visitUrl" required class="w-full p-2.5 mt-1 border-2 border-[#18181B] rounded" placeholder="https://...">
          </div>
          <button type="submit" class="w-full bg-[#18181B] text-white font-bold uppercase tracking-wider py-3 border-2 border-[#18181B] rounded hover:bg-neutral-800 shadow-[4px_4px_0px_0px_#18181B] transition-all">Submit Project</button>
        </form>
      </div>

      <!-- Tabel List Project -->
      <div class="lg:col-span-2">
        <div class="bg-white border-2 border-[#18181B] shadow-[6px_6px_0px_0px_#18181B] rounded-xl overflow-hidden">
          <table class="w-full text-left border-collapse">
            <thead class="bg-[#18181B] text-white text-xs uppercase tracking-wider">
              <tr>
                <th class="p-4">Title</th>
                <th class="p-4">Category</th>
                <th class="p-4">Year</th>
                <th class="p-4 text-center">Action</th>
              </tr>
            </thead>
            <tbody id="projects-table-body" class="divide-y-2 divide-[#18181B]">
              <!-- Data dari Firebase akan muncul disini -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- FIREBASE CONFIG & SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
    apiKey: "AIzaSyC8L6lzxdiXbUQtztGseRoRh1PW7xg1oZc",
    authDomain: "portofolio-admin-16a36.firebaseapp.com",
    projectId: "portofolio-admin-16a36",
    storageBucket: "portofolio-admin-16a36.firebasestorage.app",
    messagingSenderId: "635906631863",
    appId: "1:635906631863:web:f04a8a4d6d65bc232a0532",
    measurementId: "G-67LJHVEXTW"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Otentikasi / Login System
    window.login = () => {
      const e = document.getElementById('email').value;
      const p = document.getElementById('password').value;
      signInWithEmailAndPassword(auth, e, p).catch(err => alert(err.message));
    };

    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, user => {
      if (user) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        loadProjects();
      } else {
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('dashboard-section').classList.add('hidden');
      }
    });

    // Tambah Data (Create)
    document.getElementById('project-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newProject = {
        title: document.getElementById('title').value,
        subtitle: document.getElementById('subtitle').value,
        category: document.getElementById('category').value,
        description: document.getElementById('description').value,
        year: document.getElementById('year').value,
        techStack: document.getElementById('techStack').value,
        imageUrl: document.getElementById('imageUrl').value,
        visitUrl: document.getElementById('visitUrl').value,
        createdAt: new Date()
      };
      
      await addDoc(collection(db, "projects"), newProject);
      e.target.reset();
      alert("Project berhasil ditambahkan!");
    });

    // Tampilkan Data (Read)
    function loadProjects() {
      onSnapshot(collection(db, "projects"), (snapshot) => {
        const tbody = document.getElementById('projects-table-body');
        tbody.innerHTML = '';
        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          tbody.innerHTML += `
            <tr class="hover:bg-neutral-50 transition-colors">
              <td class="p-4 font-bold text-sm">${data.title}</td>
              <td class="p-4 text-sm font-mono text-neutral-600">${data.category}</td>
              <td class="p-4 text-sm">${data.year}</td>
              <td class="p-4 text-center">
                <button onclick="deleteProject('${docSnap.id}')" class="text-xs bg-red-100 text-red-600 font-bold px-3 py-1 rounded border border-red-600 hover:bg-red-600 hover:text-white transition-colors">Hapus</button>
              </td>
            </tr>
          `;
        });
      });
    }

    // Hapus Data (Delete)
    window.deleteProject = async (id) => {
      if(confirm("Yakin ingin menghapus project ini?")) {
        await deleteDoc(doc(db, "projects", id));
      }
    }
  </script>
</body>
</html>
