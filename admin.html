<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Web Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar to match the brutalist aesthetic */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #FAFAFA; border-left: 2px solid #18181B; }
        ::-webkit-scrollbar-thumb { background: #18181B; }
    </style>
</head>
<body class="bg-[#FAFAFA] text-[#18181B] min-h-screen font-sans selection:bg-emerald-300 selection:text-black">

    <!-- NOTIFICATION TOAST -->
    <div id="toast" class="fixed top-5 right-5 z-50 transform transition-all duration-300 translate-x-full opacity-0 bg-white border-2 border-[#18181B] shadow-[4px_4px_0px_0px_#18181B] px-5 py-3 rounded-lg font-bold text-sm uppercase tracking-wide">
        <span id="toast-message">Message</span>
    </div>

    <!-- ========================================== -->
    <!-- 1. LOGIN SECTION (Only visible when logged out) -->
    <!-- ========================================== -->
    <section id="login-view" class="min-h-screen flex items-center justify-center p-4 transition-opacity duration-300">
        <div class="w-full max-w-md bg-white rounded-xl border-2 border-[#18181B] shadow-[8px_8px_0px_0px_#18181B] p-8 space-y-8">
            
            <div class="text-center space-y-2">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-neutral-100 border-2 border-[#18181B] mb-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 class="text-3xl font-black uppercase tracking-tighter">Admin Access</h1>
                <p class="text-xs font-bold text-neutral-500 uppercase tracking-[0.15em]">Authorized Personnel Only</p>
            </div>

            <form id="login-form" class="space-y-5">
                <div class="space-y-1.5">
                    <label class="text-xs font-black uppercase tracking-wider">Email Address</label>
                    <input type="email" id="email" required class="w-full px-4 py-3 bg-[#F4F4F5] border-2 border-[#18181B] rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:bg-white transition-colors font-medium" placeholder="admin@example.com">
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-black uppercase tracking-wider">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 bg-[#F4F4F5] border-2 border-[#18181B] rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:bg-white transition-colors font-medium" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full inline-flex items-center justify-center gap-2 px-7 py-4 rounded-lg bg-[#18181B] text-white hover:bg-neutral-800 font-black text-xs uppercase tracking-[0.2em] transition-all duration-200 shadow-[4px_4px_0px_0px_#10B981] hover:shadow-[2px_2px_0px_0px_#10B981] hover:translate-y-[2px] hover:translate-x-[2px]">
                    Login to Dashboard
                </button>
            </form>
        </div>
    </section>

    <!-- ========================================== -->
    <!-- 2. DASHBOARD SECTION (Visible after login) -->
    <!-- ========================================== -->
    <section id="dashboard-view" class="hidden min-h-screen pb-20">
        
        <!-- Navbar -->
        <nav class="bg-white border-b-2 border-[#18181B] sticky top-0 z-40">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse border border-[#18181B]"></span>
                    <span class="font-black uppercase tracking-widest text-sm">Workspace / Admin</span>
                </div>
                <button id="logout-btn" class="text-xs font-bold uppercase tracking-wider text-red-600 hover:text-red-800 px-3 py-1.5 border-2 border-transparent hover:border-red-600 rounded transition-colors">
                    Log Out
                </button>
            </div>
        </nav>

        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 mt-10 grid grid-cols-1 lg:grid-cols-12 gap-10">
            
            <!-- Left Col: Form Input -->
            <div class="lg:col-span-4">
                <div class="bg-white rounded-xl border-2 border-[#18181B] shadow-[6px_6px_0px_0px_#18181B] p-6 sticky top-24">
                    <h2 class="text-xl font-black uppercase tracking-tight mb-6 flex items-center justify-between">
                        <span id="form-title">Add New Project</span>
                        <button id="cancel-edit-btn" class="hidden text-[10px] bg-red-100 text-red-700 px-2 py-1 rounded border border-red-700 uppercase tracking-wider">Cancel Edit</button>
                    </h2>
                    
                    <form id="project-form" class="space-y-4">
                        <input type="hidden" id="project-id"> <!-- Hidden field for editing -->
                        
                        <div class="space-y-1">
                            <label class="text-[10px] font-black uppercase tracking-wider text-neutral-600">Project Title</label>
                            <input type="text" id="proj-title" required class="w-full px-3 py-2 bg-neutral-50 border-2 border-[#18181B] rounded-md focus:outline-none focus:bg-white text-sm font-bold" placeholder="X TJKT 1 WEB PROFILE">
                        </div>
                        
                        <div class="space-y-1">
                            <label class="text-[10px] font-black uppercase tracking-wider text-neutral-600">Category / Type</label>
                            <input type="text" id="proj-category" required class="w-full px-3 py-2 bg-neutral-50 border-2 border-[#18181B] rounded-md focus:outline-none focus:bg-white text-sm font-bold" placeholder="WEB PROFILE">
                        </div>
                        
                        <div class="space-y-1">
                            <label class="text-[10px] font-black uppercase tracking-wider text-neutral-600">Description</label>
                            <textarea id="proj-desc" required rows="3" class="w-full px-3 py-2 bg-neutral-50 border-2 border-[#18181B] rounded-md focus:outline-none focus:bg-white text-sm font-medium" placeholder="A web profile that showing about..."></textarea>
                        </div>
                        
                        <div class="space-y-1">
                            <label class="text-[10px] font-black uppercase tracking-wider text-neutral-600">Image URL</label>
                            <input type="url" id="proj-image" required class="w-full px-3 py-2 bg-neutral-50 border-2 border-[#18181B] rounded-md focus:outline-none focus:bg-white text-sm" placeholder="https://imgur.com/image.png (or path)">
                            <p class="text-[10px] text-neutral-500">Upload to Imgur/Drive first, paste direct link here.</p>
                        </div>

                        <div class="space-y-1">
                            <label class="text-[10px] font-black uppercase tracking-wider text-neutral-600">Tech Stack (Comma Separated)</label>
                            <input type="text" id="proj-tags" required class="w-full px-3 py-2 bg-neutral-50 border-2 border-[#18181B] rounded-md focus:outline-none focus:bg-white text-sm font-bold" placeholder="HTML5, TAILWINDCSS, FIREBASE">
                        </div>

                        <div class="space-y-1">
                            <label class="text-[10px] font-black uppercase tracking-wider text-neutral-600">Visit / Live Link</label>
                            <input type="url" id="proj-link" required class="w-full px-3 py-2 bg-neutral-50 border-2 border-[#18181B] rounded-md focus:outline-none focus:bg-white text-sm" placeholder="https://xtjkt1.github.io">
                        </div>

                        <button type="submit" id="submit-btn" class="w-full mt-4 inline-flex items-center justify-center gap-2 px-5 py-3 rounded-lg bg-[#18181B] text-white hover:bg-neutral-800 font-black text-xs uppercase tracking-[0.2em] transition-all shadow-[4px_4px_0px_0px_#E5E5E5] hover:translate-y-[2px] hover:translate-x-[2px] hover:shadow-none border-2 border-[#18181B]">
                            Publish Project
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Col: Projects List -->
            <div class="lg:col-span-8 space-y-6">
                <div class="flex items-center justify-between">
                    <h2 class="text-3xl font-black uppercase tracking-tighter">Manage Projects</h2>
                    <div class="text-xs font-bold uppercase tracking-wider text-neutral-500">Live Syncing <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 ml-1"></span></div>
                </div>

                <!-- Projects Grid -->
                <div id="projects-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Project Cards will be injected here by JS -->
                    <div class="col-span-full py-12 text-center text-neutral-500 font-bold uppercase tracking-widest text-sm">
                        Loading database...
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- ========================================== -->
    <!-- FIREBASE & LOGIC SCRIPT -->
    <!-- ========================================== -->
    <!-- Replace the config below with your actual Firebase Config -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ⚠️ PASTE YOUR FIREBASE CONFIGURATION HERE ⚠️
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyC8L6lzxdiXbUQtztGseRoRh1PW7xg1oZc",
            authDomain: "portofolio-admin-16a36.firebaseapp.com",
            projectId: "portofolio-admin-16a36",
            storageBucket: "portofolio-admin-16a36.firebasestorage.app",
            messagingSenderId: "635906631863",
            appId: "1:635906631863:web:f04a8a4d6d65bc232a0532",
            measurementId: "G-67LJHVEXTW"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DOM Elements
        const loginView = document.getElementById('login-view');
        const dashboardView = document.getElementById('dashboard-view');
        const loginForm = document.getElementById('login-form');
        const logoutBtn = document.getElementById('logout-btn');
        const projectForm = document.getElementById('project-form');
        const projectsList = document.getElementById('projects-list');
        
        // Toast Function
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            toast.className = `fixed top-5 right-5 z-50 transform transition-all duration-300 bg-white border-2 border-[#18181B] shadow-[4px_4px_0px_0px_#18181B] px-5 py-3 rounded-lg font-bold text-sm uppercase tracking-wide ${isError ? 'text-red-600' : 'text-emerald-600'}`;
            
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
            }, 3000);
        }

        // --- AUTHENTICATION STATE OBSERVER ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Logged in
                loginView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
                loadProjects(); // Fetch data
            } else {
                // Logged out
                dashboardView.classList.add('hidden');
                loginView.classList.remove('hidden');
                loginView.classList.add('flex');
            }
        });

        // --- LOGIN HANDLER ---
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = loginForm.querySelector('button');
            
            btn.innerHTML = 'Authenticating...';
            
            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    showToast('Login Successful!');
                    loginForm.reset();
                    btn.innerHTML = 'Login to Dashboard';
                })
                .catch((error) => {
                    showToast('Invalid Email or Password', true);
                    btn.innerHTML = 'Login to Dashboard';
                });
        });

        // --- LOGOUT HANDLER ---
        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                showToast('Logged out securely');
            });
        });

        // --- LOAD PROJECTS (REAL-TIME READ) ---
        function loadProjects() {
            const q = query(collection(db, "projects"), orderBy("createdAt", "desc"));
            
            onSnapshot(q, (snapshot) => {
                projectsList.innerHTML = ''; // Clear loading text
                
                if (snapshot.empty) {
                    projectsList.innerHTML = `<div class="col-span-full py-12 text-center text-neutral-400 font-bold uppercase tracking-widest text-sm border-2 border-dashed border-neutral-300 rounded-xl">No projects found. Add one!</div>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    
                    // Split tags for badging
                    const tagsArray = data.tags.split(',').map(tag => tag.trim());
                    let tagsHTML = '';
                    tagsArray.forEach(tag => {
                        tagsHTML += `<span class="px-2 py-1 text-[9px] font-black uppercase tracking-wider border border-[#18181B] rounded">${tag}</span>`;
                    });

                    // Build Card HTML matching your portfolio design
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-xl border-2 border-[#18181B] shadow-[6px_6px_0px_0px_#18181B] flex flex-col overflow-hidden transition-transform hover:-translate-y-1";
                    card.innerHTML = `
                        <div class="h-48 border-b-2 border-[#18181B] bg-neutral-100 overflow-hidden relative">
                            <img src="${data.image}" alt="${data.title}" class="w-full h-full object-cover">
                            <div class="absolute top-3 right-3 flex gap-2">
                                <button onclick="window.editMode('${id}')" class="bg-white p-2 rounded-md border-2 border-[#18181B] shadow-[2px_2px_0px_0px_#18181B] hover:bg-neutral-100"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                                <button onclick="window.deleteProj('${id}')" class="bg-red-500 text-white p-2 rounded-md border-2 border-[#18181B] shadow-[2px_2px_0px_0px_#18181B] hover:bg-red-600"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                            </div>
                        </div>
                        <div class="p-5 flex-1 flex flex-col">
                            <p class="text-[10px] font-bold text-neutral-500 uppercase tracking-[0.2em] mb-1">${data.category}</p>
                            <h3 class="text-xl font-black uppercase tracking-tight mb-2">${data.title}</h3>
                            <p class="text-xs text-neutral-600 font-medium mb-4 line-clamp-3">${data.description}</p>
                            
                            <div class="flex flex-wrap gap-2 mb-5 mt-auto">
                                ${tagsHTML}
                            </div>
                            
                            <a href="${data.link}" target="_blank" class="inline-flex items-center gap-1 text-xs font-black uppercase tracking-widest hover:text-emerald-600 transition-colors">
                                Visit <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </a>
                        </div>
                    `;
                    projectsList.appendChild(card);
                });
            });
        }

        // --- ADD OR UPDATE PROJECT (CREATE/UPDATE) ---
        projectForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerHTML = 'Saving...';

            const id = document.getElementById('project-id').value;
            const projectData = {
                title: document.getElementById('proj-title').value,
                category: document.getElementById('proj-category').value,
                description: document.getElementById('proj-desc').value,
                image: document.getElementById('proj-image').value,
                tags: document.getElementById('proj-tags').value,
                link: document.getElementById('proj-link').value,
                updatedAt: serverTimestamp()
            };

            try {
                if (id) {
                    // Update existing
                    await updateDoc(doc(db, "projects", id), projectData);
                    showToast("Project Updated!");
                    exitEditMode();
                } else {
                    // Create new
                    projectData.createdAt = serverTimestamp();
                    await addDoc(collection(db, "projects"), projectData);
                    showToast("Project Published!");
                    projectForm.reset();
                }
            } catch (error) {
                showToast("Error saving project", true);
                console.error(error);
            }
            btn.innerHTML = id ? 'Update Project' : 'Publish Project';
        });

        // --- DELETE PROJECT ---
        window.deleteProj = async (id) => {
            if(confirm("Are you sure you want to delete this project? This cannot be undone.")) {
                try {
                    await deleteDoc(doc(db, "projects", id));
                    showToast("Project Deleted!");
                } catch (error) {
                    showToast("Error deleting project", true);
                }
            }
        };

        // --- EDIT MODE HANDLERS ---
        window.editMode = async (id) => {
            // Fetch data from DOM directly for simplicity (in production, fetch from Firestore)
            showToast("Fetching project data...");
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // Get document
            import('https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js').then(async (module) => {
                const getDoc = module.getDoc;
                const docSnap = await getDoc(doc(db, "projects", id));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('project-id').value = id;
                    document.getElementById('proj-title').value = data.title;
                    document.getElementById('proj-category').value = data.category;
                    document.getElementById('proj-desc').value = data.description;
                    document.getElementById('proj-image').value = data.image;
                    document.getElementById('proj-tags').value = data.tags;
                    document.getElementById('proj-link').value = data.link;
                    
                    document.getElementById('form-title').innerText = "Edit Project";
                    document.getElementById('submit-btn').innerText = "Update Project";
                    document.getElementById('cancel-edit-btn').classList.remove('hidden');
                }
            });
        };

        function exitEditMode() {
            projectForm.reset();
            document.getElementById('project-id').value = '';
            document.getElementById('form-title').innerText = "Add New Project";
            document.getElementById('submit-btn').innerText = "Publish Project";
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        document.getElementById('cancel-edit-btn').addEventListener('click', (e) => {
            e.preventDefault();
            exitEditMode();
        });

    </script>
</body>
</html>
